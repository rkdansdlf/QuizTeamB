<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록 - Memory Treasures</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css"> <!-- /css 로 경로 수정 -->
</head>
<body>
    <!-- 헤더 -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🏪</span>
                    <h1><a href="/">Memory Treasures</a></h1>
                </div>
                <nav class="main-nav">
                    <a href="/" class="nav-link">홈</a>
                    <a href="/products" class="nav-link active">상품</a>
                    <a href="/memory-simulator" class="nav-link">기억 토해내기</a>
                    <a href="/cart" class="nav-link">
                        <span class="cart-icon">🛒</span>
                        장바구니 <span id="cart-count" class="cart-count">0</span>
                    </a>
                </nav>
                <div class="user-menu">
                    <div class="user-info" id="userInfo" style="display: none;">
                        <span id="username"></span>
                        <button class="logout-btn">로그아웃</button>
                    </div>
                    <div class="auth-buttons" id="authButtons">
                        <a href="/login" class="btn btn-outline">로그인</a>
                        <a href="/register" class="btn btn-primary">회원가입</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 상품 필터 섹션 -->
    <section class="product-filters">
        <div class="container">
            <div class="filters-header">
                <h2>🎭 기억의 보물들</h2>
            </div>
            <div class="filters-content">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="기억 속 물건을 찾아보세요..." />
                    <button id="searchBtn" class="search-btn">🔍</button>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label>기억 종류:</label>
                        <select id="memoryTypeFilter">
                            <option value="">전체</option>
                            <option value="CHILDHOOD">어린시절 🧸</option>
                            <option value="FRIENDSHIP">우정 👫</option>
                            <option value="LOVE">사랑 💕</option>
                            <option value="ADVENTURE">모험 🗺️</option>
                            <option value="FOOD">음식 🍰</option>
                            <option value="TOY">장난감 🎮</option>
                            <option value="EXPERIMENT">실험 🧪</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>가격 범위:</label>
                        <select id="priceFilter">
                            <option value="">전체</option>
                            <option value="0-10000">1만원 미만</option>
                            <option value="10000-50000">1만원 - 5만원</option>
                            <option value="50000-100000">5만원 - 10만원</option>
                            <option value="100000+">10만원 이상</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>기억 주인:</label>
                        <select id="ownerFilter">
                            <option value="">전체</option>
                            <option value="토심이">토심이 🐰</option>
                            <option value="와플곰">와플곰 🧸</option>
                            <option value="탱고">탱고 🐱</option>
                            <option value="누렁이">누렁이 🐕</option>
                            <option value="바쁘개">바쁘개 🐕‍🦺</option>
                            <option value="급하냥">급하냥 🐱</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>감정 강도:</label>
                        <input type="range" id="emotionFilter" min="1" max="10" value="5">
                        <span id="emotionDisplay">5 이상</span>
                    </div>
                    <div class="filter-group">
                        <label>정렬:</label>
                        <!-- 👇👇 value 값이 백엔드 필드명과 일치하도록 수정되었습니다! 👇👇 -->
                        <select id="sortFilter">
                            <option value="createdAt,desc">최신순</option>
                            <option value="createdAt,asc">오래된 순</option>
                            <option value="price,asc">가격 낮은 순</option>
                            <option value="price,desc">가격 높은 순</option>
                            <option value="emotionLevel,desc">감정 강도 높은 순</option>
                            <option value="rarityScore,desc">희귀도 높은 순</option>
                        </select>
                    </div>
                </div>
                <div class="active-filters" id="activeFilters"></div>
            </div>
        </div>
    </section>

    <!-- 상품 목록 -->
    <section class="products-section">
        <div class="container">
            <div class="products-header">
                <div class="results-info">
                    <span id="resultsCount">총 0개의 기억</span>
                    <span id="loadingIndicator" class="loading" style="display: none;">🌀 기억을 불러오는 중...</span>
                </div>
                <div class="quick-actions">
                    <button id="clearFiltersBtn" class="btn btn-outline btn-small">필터 초기화</button>
                    <button id="refreshProductsBtn" class="btn btn-primary btn-small">🔄 새로고침</button>
                </div>
            </div>
            <div class="products-container">
                <div id="productsGrid" class="products-grid view-grid">
                    <!-- JavaScript가 여기에 상품 카드를 그립니다. -->
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon">😅</div>
                    <h3>아직 기억이 없네요...</h3>
                    <p>누렁이에게 기억을 토해내달라고 부탁해보세요!</p>
                    <a href="/memory-simulator" class="btn btn-primary">기억 토해내기 →</a>
                </div>
                <div class="load-more-container" id="loadMoreContainer">
                    <button class="btn btn-outline" id="loadMoreBtn">더 많은 기억 보기</button>
                </div>
            </div>
        </div>
    </section>
    
    <div id="toastContainer" class="toast-container"></div>

    
    <script src="/js/memory-treasures.js"></script>
    <script src="/js/products.js"></script>

</body>
</html>
